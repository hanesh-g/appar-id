services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: apaar_app
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run scripts/configure_local.py first}
      POSTGRES_DB: apaar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - apaar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apaar_app -d apaar"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  apaar_pg:
